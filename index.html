<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <!-- اطلاعات سئو برای گوگل -->
    <meta name="description" content="نکسوس‌ایی (NexusAI) یک هاب هوش مصنوعی پیشرفته برای چت، کدنویسی، بازی‌سازی و تولید تصویر است.">
    <meta name="keywords" content="هوش مصنوعی, چت بات, بازی سازی, تولید تصویر, NexusAI, جمینای">
    <meta name="author" content="NexusAI Team">

    <!-- شبکه‌های اجتماعی (برای وقتی لینک سایت رو تلگرام یا واتساپ می‌فرستید) -->
    <meta property="og:title" content="NexusAI - هاب هوش مصنوعی">
    <meta property="og:description" content="دستیار هوشمند برای بازی‌سازی، برنامه‌نویسی و پردازش هوش مصنوعی">
    <meta property="og:type" content="website">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - هاب هوش مصنوعی</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Vazirmatn', sans-serif; }
        body { background-color: #080c14; color: #e2e8f0; }
        .sidebar { background-color: #0d1322; border-left: 1px solid #1a2234; }
        .action-card {
            background: #111827;
            border: 1px solid #1f2937;
            transition: all 0.25s ease;
        }
        .action-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15);
        }
        .message-ai { background: #111827; border: 1px solid #1f2937; }
        .message-user { background: #2563eb; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #080c14; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- سایدبار سمت راست -->
    <aside class="w-72 sidebar flex flex-col justify-between hidden lg:flex select-none">
        <div>
            <div class="p-6 flex items-center gap-3 border-b border-gray-800/60">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-lg shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-atom"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wider text-white">NexusAI</h1>
                    <p class="text-[11px] text-gray-400">هاب چند هوش مصنوعی</p>
                </div>
            </div>

            <div class="p-4 space-y-2">
                <button onclick="newChat()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-300 hover:bg-gray-800/55 transition-colors">
                    <i class="fa-solid fa-plus text-blue-400 w-5"></i>
                    <span>چت جدید</span>
                </button>
                <button onclick="clearHistory()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-red-400 hover:bg-red-500/10 transition-colors">
                    <i class="fa-solid fa-trash w-5"></i>
                    <span>پاک کردن تاریخچه</span>
                </button>
            </div>
        </div>

        <!-- تنظیم کلید API در سایدبار -->
        <div class="p-4 border-t border-gray-800/60">
            <label class="block text-xs text-gray-400 mb-2 font-medium">کلید API گوگل (Gemini):</label>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-[#111827] border border-gray-700 rounded-xl px-3 py-2 text-xs text-gray-200 outline-none focus:border-blue-500">
            <button onclick="saveApiKey()" class="mt-2 w-full bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white text-xs py-2 rounded-xl border border-blue-500/30 transition-all font-medium">
                ذخیره کلید
            </button>
        </div>
    </aside>

    <!-- بخش اصلی چت و ابزارها -->
    <main class="flex-1 flex flex-col h-full bg-[#080c14]">
        <header class="h-16 border-b border-gray-800/60 flex items-center justify-between px-6 bg-[#0d1322]/50 backdrop-blur">
            <div class="flex items-center gap-3">
                <span class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-network-wired text-blue-500"></i>
                    NexusAI Hub
                </span>
            </div>
        </header>

        <!-- محتوای وسط صفحه -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6">
            <div id="welcome-screen" class="max-w-3xl mx-auto space-y-6">
                <div class="flex items-start gap-4">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-sm shrink-0 shadow-lg font-bold">AI</div>
                    <div class="message-ai p-5 rounded-2xl text-sm leading-relaxed text-gray-200 shadow-xl w-full">
                        سلام! کلید API جمینای خود را وارد کنید. از دکمه‌های زیر می‌توانید برای حالت‌های مختلف استفاده کنید:
                    </div>
                </div>

                <!-- دکمه‌های اصلی درخواستی -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <button onclick="setMode('study')" class="action-card p-4 rounded-2xl flex items-center gap-4 text-right">
                        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-xl shrink-0">
                            <i class="fa-solid fa-graduation-cap"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-white text-sm">حالت درس</h3>
                            <p class="text-xs text-gray-400 mt-0.5">آموزش و یادگیری قدم‌به‌قدم</p>
                        </div>
                    </button>

                    <button onclick="setMode('image')" class="action-card p-4 rounded-2xl flex items-center gap-4 text-right">
                        <div class="w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400 text-xl shrink-0">
                            <i class="fa-solid fa-image"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-white text-sm">عکس‌سازی</h3>
                            <p class="text-xs text-gray-400 mt-0.5">تولید تصویر واقعی با هوش مصنوعی</p>
                        </div>
                    </button>

                    <button onclick="setMode('voice')" class="action-card p-4 rounded-2xl flex items-center gap-4 text-right">
                        <div class="w-12 h-12 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 text-xl shrink-0">
                            <i class="fa-solid fa-microphone"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-white text-sm">گفتگوی صوتی</h3>
                            <p class="text-xs text-gray-400 mt-0.5">پخش صوتی پاسخ‌ها</p>
                        </div>
                    </button>

                    <button onclick="setMode('code')" class="action-card p-4 rounded-2xl flex items-center gap-4 text-right">
                        <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-xl shrink-0">
                            <i class="fa-solid fa-gamepad"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-white text-sm">کد و بازی‌سازی</h3>
                            <p class="text-xs text-gray-400 mt-0.5">اسکریپت‌نویسی بازی و منطق</p>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- باکس ارسال پیام -->
        <div class="p-4 border-t border-gray-800/60 bg-[#0d1322]/50">
            <div class="max-w-3xl mx-auto flex items-center gap-3 bg-[#111827] border border-gray-700 rounded-2xl p-2 shadow-2xl focus-within:border-blue-500 transition-all">
                <input type="text" id="user-input" placeholder="پیام خود را بنویسید..." class="flex-1 bg-transparent border-none outline-none px-4 text-sm text-gray-200 placeholder-gray-500">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white w-10 h-10 rounded-xl flex items-center justify-center transition-all shadow-md">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        let currentMode = 'general';
        let apiKey = localStorage.getItem('nexus_gemini_key') || '';
        let chatHistory = JSON.parse(localStorage.getItem('nexus_chat_history') || '[]');

        window.onload = function() {
            if(apiKey) {
                document.getElementById('api-key-input').value = apiKey;
            }
            renderHistory();
        }

        function saveApiKey() {
            const GAPGPTMASKTOKENstvvyz10wuX0X = document.getElementById('api-key-input').value.trim();
            if(GAPGPTMASKTOKENstvvyz10wuX1X) {
                apiKey = GAPGPTMASKTOKENstvvyz10wuX2X;
                localStorage.setItem('nexus_gemini_key', apiKey);
                alert('کلید API با موفقیت ذخیره شد!');
            } else {
                alert('لطفاً یک کلید معتبر وارد کنید.');
            }
        }

        function setMode(mode) {
            currentMode = mode;
            let promptText = "";
            if(mode === 'study') promptText = "حالت درس فعال شد. مبحث خود را بنویسید...";
            else if(mode === 'image') promptText = "حالت عکس‌سازی فعال شد. توصیف تصویر مورد نظر را بنویسید...";
            else if(mode === 'voice') promptText = "حالت صوتی فعال شد. پیام خود را بنویسید...";
            else if(mode === 'code') promptText = "حالت کد و بازی‌سازی فعال شد. سوال برنامه‌نویسی خود را بنویسید...";
            
            document.getElementById('user-input').placeholder = promptText;
            document.getElementById('user-input').focus();
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fa-IR';
                window.speechSynthesis.speak(utterance);
            }
        }

        function copyText(button, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = button.innerHTML;
                button.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> کپی شد';
                setTimeout(() => { button.innerHTML = originalHTML; }, 2000);
            });
        }

        function renderHistory() {
            const chatContainer = document.getElementById('chat-container');
            if (chatHistory.length > 0) {
                document.getElementById('welcome-screen')?.remove();
            }

            chatHistory.forEach(item => {
                if (item.type === 'user') {
                    chatContainer.insertAdjacentHTML('beforeend', `
                        <div class="max-w-3xl mx-auto flex items-start gap-4 justify-end">
                            <div class="message-user p-4 rounded-2xl text-sm leading-relaxed text-white shadow-lg">${item.text}</div>
                            <div class="w-10 h-10 rounded-xl bg-gray-800 border border-gray-700 flex items-center justify-center text-gray-300 text-xs shrink-0 font-bold">شما</div>
                        </div>`);
                } else if (item.type === 'ai') {
                    chatContainer.insertAdjacentHTML('beforeend', `
                        <div class="max-w-3xl mx-auto flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-sm shrink-0 font-bold">AI</div>
                            <div class="message-ai p-5 rounded-2xl text-sm leading-relaxed text-gray-200 w-full shadow-xl space-y-3">
                                <div class="whitespace-pre-wrap">${item.text}</div>
                                <div class="flex justify-end pt-2 border-t border-gray-800">
                                    <button onclick="copyText(this, \`${item.text.replace(/`/g, '\\`')}\`)" class="text-xs text-gray-400 hover:text-blue-400 flex items-center gap-1.5 transition-colors">
                                        <i class="fa-regular fa-copy"></i> کپی متن
                                    </button>
                                </div>
                            </div>
                        </div>`);
                } else if (item.type === 'image') {
                    chatContainer.insertAdjacentHTML('beforeend', `
                        <div class="max-w-3xl mx-auto flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-white text-sm shrink-0 font-bold">AI</div>
                            <div class="message-ai p-4 rounded-2xl text-sm text-gray-200 w-full shadow-xl space-y-3">
                                <p class="text-xs text-purple-400 font-medium">تصویر ساخته شده: "${item.prompt}"</p>
                                <img src="${item.url}" alt="${item.prompt}" class="rounded-xl w-full max-w-md border border-gray-700 shadow-lg">
                            </div>
                        </div>`);
                }
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if(!text) return;

            document.getElementById('welcome-screen')?.remove();
            const chatContainer = document.getElementById('chat-container');

            // ثبت پیام کاربر
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="max-w-3xl mx-auto flex items-start gap-4 justify-end">
                    <div class="message-user p-4 rounded-2xl text-sm leading-relaxed text-white shadow-lg">${text}</div>
                    <div class="w-10 h-10 rounded-xl bg-gray-800 border border-gray-700 flex items-center justify-center text-gray-300 text-xs shrink-0 font-bold">شما</div>
                </div>`);
            
            chatHistory.push({ type: 'user', text: text });
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // عکس‌سازی
            if (currentMode === 'image') {
                const loadingId = 'loading-' + Date.now();
                chatContainer.insertAdjacentHTML('beforeend', `
                    <div id="${loadingId}" class="max-w-3xl mx-auto flex items-start gap-4">
                        <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-white text-sm shrink-0 font-bold">AI</div>
                        <div class="message-ai p-5 rounded-2xl text-sm text-gray-400 w-full shadow-xl flex items-center gap-2">
                            <i class="fa-solid fa-circle-notch fa-spin text-purple-500"></i> در حال تولید تصویر...
                        </div>
                    </div>`);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                const encodedPrompt = encodeURIComponent(text);
                const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true`;

                document.getElementById(loadingId).remove();
                chatContainer.insertAdjacentHTML('beforeend', `
                    <div class="max-w-3xl mx-auto flex items-start gap-4">
                        <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-white text-sm shrink-0 font-bold">AI</div>
                        <div class="message-ai p-4 rounded-2xl text-sm text-gray-200 w-full shadow-xl space-y-3">
                            <p class="text-xs text-purple-400 font-medium">تصویر ساخته شده: "${text}"</p>
                            <img src="${imageUrl}" alt="${text}" class="rounded-xl w-full max-w-md border border-gray-700 shadow-lg">
                        </div>
                    </div>`);

                chatHistory.push({ type: 'image', prompt: text, url: imageUrl });
                localStorage.setItem('nexus_chat_history', JSON.stringify(chatHistory));
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return;
            }

            if(!apiKey) {
                alert('لطفاً ابتدا کلید API خود را وارد کنید.');
                return;
            }

            const loadingId = 'loading-' + Date.now();
            chatContainer.insertAdjacentHTML('beforeend', `
                <div id="${loadingId}" class="max-w-3xl mx-auto flex items-start gap-4">
                    <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-sm shrink-0 font-bold">AI</div>
                    <div class="message-ai p-5 rounded-2xl text-sm text-gray-400 w-full shadow-xl flex items-center gap-2">
                        <i class="fa-solid fa-circle-notch fa-spin text-blue-500"></i> در حال پردازش پاسخ...
                    </div>
                </div>`);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                let systemInstruction = "";
                if (currentMode === 'study') systemInstruction = "تو یک معلم خصوصی دلسوز هستی که مطالب را خیلی ساده توضیح می‌دهی.";
                else if (currentMode === 'code') systemInstruction = "تو یک برنامه نویس ارشد بازی‌سازی (Unity/Unreal/C#) هستی که کدهای بهینه و دقیق میدهی.";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemInstruction + "\n\n" + text }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatContainer.insertAdjacentHTML('beforeend', `
                        <div class="max-w-3xl mx-auto flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-sm shrink-0 font-bold">AI</div>
                            <div class="message-ai p-5 rounded-2xl text-sm leading-relaxed text-gray-200 w-full shadow-xl space-y-3">
                                <div class="whitespace-pre-wrap">${aiReply}</div>
                                <div class="flex justify-end pt-2 border-t border-gray-800">
                                    <button onclick="copyText(this, \`${aiReply.replace(/`/g, '\\`')}\`)" class="text-xs text-gray-400 hover:text-blue-400 flex items-center gap-1.5 transition-colors">
                                        <i class="fa-regular fa-copy"></i> کپی متن
                                    </button>
                                </div>
                            </div>
                        </div>`);

                    chatHistory.push({ type: 'ai', text: aiReply });
                    localStorage.setItem('nexus_chat_history', JSON.stringify(chatHistory));

                    if (currentMode === 'voice') speakText(aiReply);
                } else {
                    throw new Error('پاسخ نامعتبر');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatContainer.insertAdjacentHTML('beforeend', `
                    <div class="max-w-3xl mx-auto flex items-start gap-4">
                        <div class="text-red-500 font-bold">!</div>
                        <div class="message-ai p-5 rounded-2xl text-sm text-red-400 w-full shadow-xl">خطا در ارتباط با سرور.</div>
                    </div>`);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function newChat() {
            localStorage.removeItem('nexus_chat_history');
            location.reload();
        }

        function clearHistory() {
            if(confirm('آیا از پاک کردن تاریخچه مطمئن هستید؟')) {
                localStorage.removeItem('nexus_chat_history');
                location.reload();
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
